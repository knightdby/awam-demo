<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWAM Review Summary</title><style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#dce2e7;--text:#23272d;--muted:#68717c;--blue:#4779ad;--green:#29745b;--green-bg:#dff1e9;--red:#984242;--red-bg:#f7e2e2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:3;padding:18px 24px;border-bottom:1px solid var(--line);background:#ffffffed;backdrop-filter:blur(10px)}header h1{margin:0;font-size:25px}header p{margin:4px 0 0;color:var(--muted)}main{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;padding:18px;min-height:calc(100vh - 94px)}aside,.viewer{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 3px 14px #23303d0a}aside{align-self:start;position:sticky;top:112px;padding:14px;max-height:calc(100vh - 130px);overflow:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.stat{padding:10px 6px;border-radius:8px;background:#f1f4f6;text-align:center}.stat b{display:block;font-size:20px}.stat small{color:var(--muted)}.task{width:100%;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:5px 0;padding:10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer}.task:hover{background:#f3f6f8}.task.active{border-color:#b9cde0;background:#eaf2f8;color:#28567f}.task small{padding:2px 7px;border-radius:99px;font-weight:700}.task .succeeded{background:var(--green-bg);color:var(--green)}.task .failed{background:var(--red-bg);color:var(--red)}.viewer{min-width:0;overflow:hidden}.viewer-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.viewer-head b{font-size:17px}.viewer-head a{color:var(--blue);text-decoration:none}.viewer iframe{display:block;width:100%;height:calc(100vh - 158px);min-height:720px;border:0;background:#fff}@media(max-width:850px){main{grid-template-columns:1fr}aside{position:static;max-height:none}.viewer iframe{height:900px}}
</style></head><body><header><h1>AWAM Review Summary</h1></header><main><aside><div id="tasks"></div></aside><section class="viewer"><div class="viewer-head"><b id="current-title"></b><a id="open-link" target="_blank">Open separately ↗</a></div><iframe id="review-frame" title="AWAM review"></iframe></section></main><script>
const reviews=[
      {title:'Stack Bowls',steps:25,path:'stack-bowls/episode-004/index.html'},
      {title:'Cook',steps:17,path:'cook/episode-001/index.html'},
      {title:'Place Plate And Cup',steps:12,path:'place-plate-and-cup/episode-001/index.html'},
      {title:'Build Bridge',steps:10,path:'build-bridge/episode-009/index.html'},
      {title:'Handover Block',steps:13,path:'handover-block/episode-001/index.html'},
      {title:'Fetch Block With Roller',steps:9,path:'fetch-block-with-roller/episode-002/index.html'},
      {title:'Exchange Mics',steps:19,path:'exchange-mics/episode-001/index.html'},
      {title:'Stack Bowls',steps:29,path:'stack-bowls/episode-002/index.html'}
];const tasks=document.getElementById('tasks'),frame=document.getElementById('review-frame'),title=document.getElementById('current-title'),openLink=document.getElementById('open-link');function selectReview(index){const review=reviews[index];frame.src=review.path;title.textContent=review.title;openLink.href=review.path;document.querySelectorAll('.task').forEach((button,i)=>button.classList.toggle('active',i===index))}reviews.forEach((review,index)=>{const button=document.createElement('button');button.className='task';button.innerHTML=`<span>${review.title}</span><small>${review.steps} steps</small>`;button.addEventListener('click',()=>selectReview(index));tasks.appendChild(button)});selectReview(0);
</script></body></html>
